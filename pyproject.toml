[project]
name = "home-assistant-rest-mapper"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "aioresponses>=0.7",
    "mypy>=1.13",
    "pytest-cov>=5.0",
    "pytest-homeassistant-custom-component",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["custom_components", "tests"]
extend-exclude = ["custom_components/rest_mapper/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "TC", "PYI"]

[tool.mypy]
strict = true
files = ["custom_components", "scripts", "tests"]
warn_unreachable = true
explicit_package_bases = true
mypy_path = ".:tests"
disallow_any_explicit = true
disallow_any_unimported = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "unused-awaitable",
]

# Home Assistant's flow base classes fix these signatures, with Any in them.
[[tool.mypy.overrides]]
module = "custom_components.rest_mapper.config_flow"
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["pytest_homeassistant_custom_component.*", "freezegun.*"]
ignore_missing_imports = true

# The test plugin ships no types, so its classes read as Any here.
[[tool.mypy.overrides]]
module = ["conftest", "test_collections", "test_endpoint", "test_flows", "test_kinds", "test_problems"]
disallow_any_unimported = false
